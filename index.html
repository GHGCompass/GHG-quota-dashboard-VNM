<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THÍ ĐIỂM PHÂN BỔ HẠN NGẠCH PHÁT THẢI KHÍ NHÀ KÍNH 2025-2026</title>
<style>
:root{
  --iki-blue:#004B87;
  --iki-blue-light:#e7f0f7;
  --iki-blue-dark:#00325a;
  --accent-orange:#F26522;
  --accent-orange-light:#fdeee5;
  --accent-yellow:#D9A404;
  --accent-yellow-light:#fdf3d6;
  --accent-red:#E4032E;
  --accent-red-light:#fbe4e7;
  --bg:#F5F7FA;
  --surface:#FFFFFF;
  --text-dark:#2B2F33;
  --text-mid:#5A6068;
  --text-light:#8A9099;
  --border:#E3E7EC;
  --shadow: 0 1px 3px rgba(0,20,40,0.08), 0 1px 2px rgba(0,20,40,0.06);
  --shadow-md: 0 4px 14px rgba(0,20,40,0.09);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:Arial, "Helvetica Neue", Helvetica, sans-serif;
  font-size:14px;
  color:var(--text-dark);
  background:var(--bg);
  line-height:1.5;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c7cfd8;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== Header ===== */
.app-header{
  background: linear-gradient(135deg, var(--iki-blue) 0%, var(--iki-blue-dark) 100%);
  color:#fff;
  padding:18px 28px 16px;
  position:sticky; top:0; z-index:100;
  box-shadow: var(--shadow-md);
}
.header-top{
  display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.header-title-block{max-width:980px;}
.header-eyebrow{
  font-size:11px; letter-spacing:1.5px; text-transform:uppercase; opacity:0.75; font-weight:bold; margin-bottom:6px;
}
.header-title{
  font-size:19px; font-weight:bold; line-height:1.35; margin:0;
  text-transform:uppercase;
}
.header-sub{
  font-size:12.5px; opacity:0.85; margin-top:6px;
}
.header-meta{
  display:flex; gap:22px; flex-wrap:wrap; font-size:12px; opacity:0.9; text-align:right;
}
.header-meta .metaitem{min-width:90px;}
.header-meta .metaitem b{display:block; font-size:17px; font-weight:bold;}

/* ===== Nav Tabs (4 pages) ===== */
.main-nav{
  display:flex; gap:6px; margin-top:16px; flex-wrap:wrap;
}
.main-nav button{
  font-family:inherit; font-size:13.5px; font-weight:bold; color:#fff;
  background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.18);
  padding:9px 18px; border-radius:8px 8px 0 0; cursor:pointer;
  transition:all .15s ease; display:flex; align-items:center; gap:7px;
}
.main-nav button .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7;}
.main-nav button:hover{background:rgba(255,255,255,0.18);}
.main-nav button.active{
  background:var(--bg); color:var(--iki-blue); border-color:var(--bg);
}
.main-nav button.active.sector-nhietdien{color:var(--accent-red);}
.main-nav button.active.sector-ximang{color:var(--accent-orange);}
.main-nav button.active.sector-satthep{color:var(--accent-yellow);}

/* ===== Layout ===== */
.page{display:none; padding:22px 28px 60px;}
.page.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-title{
  font-size:15px; font-weight:bold; color:var(--iki-blue); text-transform:uppercase;
  letter-spacing:.4px; margin:30px 0 12px; display:flex; align-items:center; gap:9px;
}
.section-title .bar{width:4px; height:16px; background:var(--iki-blue); border-radius:2px;}
.page[data-accent="red"] .section-title .bar{background:var(--accent-red);}
.page[data-accent="red"] .section-title{color:var(--accent-red);}
.page[data-accent="orange"] .section-title .bar{background:var(--accent-orange);}
.page[data-accent="orange"] .section-title{color:var(--accent-orange);}
.page[data-accent="yellow"] .section-title .bar{background:var(--accent-yellow);}
.page[data-accent="yellow"] .section-title{color:var(--accent-yellow);}
/* Trang chuyên ngành: tiêu đề luôn màu đỏ, không theo màu accent riêng của ngành */
#page-nhietdien .section-title, #page-ximang .section-title, #page-satthep .section-title{color:var(--accent-red);}
#page-nhietdien .section-title .bar, #page-ximang .section-title .bar, #page-satthep .section-title .bar{background:var(--accent-red);}
.section-title:first-child{margin-top:4px;}
.section-hint{font-size:12px;color:var(--text-light);font-weight:normal;text-transform:none;letter-spacing:0;margin-left:4px;}

/* ===== KPI cards ===== */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px;}
.kpi-card{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px 18px; border-left:4px solid var(--iki-blue); position:relative; overflow:hidden;
}
.kpi-card .kpi-label{font-size:12px; color:var(--text-mid); font-weight:bold; text-transform:uppercase; letter-spacing:.3px;}
.kpi-card .kpi-value{font-size:24px; font-weight:bold; color:var(--text-dark); margin-top:6px;}
.kpi-card .kpi-unit{font-size:11.5px; color:var(--text-light); font-weight:normal;}
.kpi-card .kpi-foot{font-size:11.5px; margin-top:5px; color:var(--text-mid);}
.kpi-card .kpi-foot.up{color:#1a8f4c;}
.kpi-card .kpi-foot.down{color:#c22222;}

/* Sector overview cards */
.sector-card-row{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.sector-card{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px 20px; border-top:4px solid var(--iki-blue);
}
.sector-card.nhietdien{border-top-color:var(--accent-red);}
.sector-card.ximang{border-top-color:var(--accent-orange);}
.sector-card.satthep{border-top-color:var(--accent-yellow);}
.sector-card .sc-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.sector-card .sc-title{font-size:14.5px; font-weight:bold; color:var(--text-dark);}
.sector-card.nhietdien .sc-title{color:var(--accent-red);}
.sector-card.ximang .sc-title{color:var(--accent-orange);}
.sector-card.satthep .sc-title{color:var(--accent-yellow);}
.sector-card .sc-badge{font-size:11px; background:var(--iki-blue-light); color:var(--iki-blue); padding:3px 9px; border-radius:20px; font-weight:bold;}
.sector-card.nhietdien .sc-badge{background:var(--accent-red-light); color:var(--accent-red);}
.sector-card.ximang .sc-badge{background:var(--accent-orange-light); color:var(--accent-orange);}
.sector-card.satthep .sc-badge{background:var(--accent-yellow-light); color:var(--accent-yellow);}
.sc-stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.sc-stat{background:var(--bg); border-radius:7px; padding:8px 10px;}
.sc-stat .lbl{font-size:10.5px; color:var(--text-light); text-transform:uppercase; font-weight:bold;}
.sc-stat .val{font-size:15px; font-weight:bold; color:var(--text-dark); margin-top:2px;}
.sc-growth{font-size:12px; font-weight:bold; margin-top:2px;}
.sc-growth.up{color:#1a8f4c;} .sc-growth.down{color:#c22222;}
.sc-boxplot{margin-top:8px;}

/* ===== Grid panels ===== */
.panel{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:2fr 1fr; gap:16px;}
.panel-title{font-size:13px; font-weight:bold; color:var(--text-dark); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
.panel-title .ptag{font-size:10.5px; font-weight:bold; color:#fff; background:var(--iki-blue); padding:2px 8px; border-radius:20px;}

/* map metric toggle */
.chip-toggle{display:inline-flex; background:var(--bg); border-radius:20px; padding:3px; gap:2px;}
.chip-toggle button{
  font-family:inherit; font-size:11.5px; font-weight:bold; border:none; background:transparent; color:var(--text-mid);
  padding:5px 13px; border-radius:16px; cursor:pointer;
}
.chip-toggle button.active{background:var(--iki-blue); color:#fff;}
.page[data-accent="red"] .chip-toggle button.active{background:var(--accent-red);}
.page[data-accent="orange"] .chip-toggle button.active{background:var(--accent-orange);}
.page[data-accent="yellow"] .chip-toggle button.active{background:var(--accent-yellow);}

/* Year tabs on sector pages */
.year-tabs{display:flex; gap:8px; margin-bottom:18px;}
.year-tabs button{
  font-family:inherit; font-size:14px; font-weight:bold; padding:9px 26px; border-radius:8px;
  border:1.5px solid var(--border); background:var(--surface); color:var(--text-mid); cursor:pointer; transition:.15s;
}
.year-tabs button.active{background:var(--iki-blue); border-color:var(--iki-blue); color:#fff;}
.page[data-accent="red"] .year-tabs button.active{background:var(--accent-red); border-color:var(--accent-red);}
.page[data-accent="orange"] .year-tabs button.active{background:var(--accent-orange); border-color:var(--accent-orange);}
.page[data-accent="yellow"] .year-tabs button.active{background:var(--accent-yellow); border-color:var(--accent-yellow);}

/* Top lists */
.rank-list{list-style:none; margin:0; padding:0;}
.rank-list li{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--border); font-size:12.5px;}
.rank-list li:last-child{border-bottom:none;}
.rank-num{width:22px; height:22px; border-radius:50%; background:var(--iki-blue-light); color:var(--iki-blue); font-weight:bold; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rank-num.top1{background:var(--iki-blue); color:#fff;}
.rank-name{flex:1; min-width:0; font-weight:bold; color:var(--text-dark); line-height:1.4;}
.rank-sub{font-size:10.5px; color:var(--text-light);}
.rank-val{font-weight:bold; color:var(--iki-blue); font-size:12.5px; white-space:nowrap;}
.page[data-accent="red"] .rank-val{color:var(--accent-red);}
.page[data-accent="orange"] .rank-val{color:var(--accent-orange);}
.page[data-accent="yellow"] .rank-val{color:var(--accent-yellow);}
.rank-bar-bg{background:var(--bg); border-radius:4px; height:5px; margin-top:4px; overflow:hidden;}
.rank-bar-fill{height:100%; background:var(--iki-blue); border-radius:4px;}
.page[data-accent="red"] .rank-bar-fill{background:var(--accent-red);}
.page[data-accent="orange"] .rank-bar-fill{background:var(--accent-orange);}
.page[data-accent="yellow"] .rank-bar-fill{background:var(--accent-yellow);}

/* Search + table */
.search-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.search-row input, .search-row select{
  font-family:inherit; font-size:13px; padding:9px 12px; border-radius:8px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--text-dark);
}
.search-row input{flex:1; min-width:200px;}
.search-row input:focus, .search-row select:focus{outline:none; border-color:var(--iki-blue);}
.page[data-accent="red"] .search-row input:focus{border-color:var(--accent-red);}
.page[data-accent="orange"] .search-row input:focus{border-color:var(--accent-orange);}
.page[data-accent="yellow"] .search-row input:focus{border-color:var(--accent-yellow);}

.table-wrap{overflow:auto; max-height:480px; border:1px solid var(--border); border-radius:8px;}
table.data-table{width:100%; border-collapse:collapse; font-size:12.5px;}
table.data-table thead th{
  position:sticky; top:0; background:var(--iki-blue); color:#fff; text-align:left; padding:9px 10px;
  font-weight:bold; white-space:nowrap; z-index:1;
}
.page[data-accent="red"] table.data-table thead th{background:var(--accent-red);}
.page[data-accent="orange"] table.data-table thead th{background:var(--accent-orange);}
.page[data-accent="yellow"] table.data-table thead th{background:var(--accent-yellow);}
table.data-table tbody td{padding:8px 10px; border-bottom:1px solid var(--border); color:var(--text-dark); vertical-align:top;}
table.data-table tbody tr:hover{background:var(--iki-blue-light);}
table.data-table tbody tr:nth-child(even){background:#fafbfc;}
table.data-table tbody tr:nth-child(even):hover{background:var(--iki-blue-light);}
.tag-sector{font-size:10.5px; font-weight:bold; padding:2px 8px; border-radius:20px; white-space:nowrap;}
.tag-sector.nhietdien{background:var(--accent-red-light); color:var(--accent-red);}
.tag-sector.ximang{background:var(--accent-orange-light); color:var(--accent-orange);}
.tag-sector.satthep{background:var(--accent-yellow-light); color:var(--accent-yellow);}
.result-count{font-size:11.5px; color:var(--text-light); margin-bottom:8px;}

/* group table */
.group-block{border:1px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden;}
.group-head{background:var(--iki-blue-light); padding:9px 12px; display:flex; justify-content:space-between; align-items:center; font-size:12.5px; flex-wrap:wrap; gap:6px;}
.page[data-accent="red"] .group-head{background:var(--accent-red-light);}
.page[data-accent="orange"] .group-head{background:var(--accent-orange-light);}
.page[data-accent="yellow"] .group-head{background:var(--accent-yellow-light);}
.group-head b{color:var(--iki-blue);}
.page[data-accent="red"] .group-head b{color:var(--accent-red);}
.page[data-accent="orange"] .group-head b{color:var(--accent-orange);}
.page[data-accent="yellow"] .group-head b{color:var(--accent-yellow);}
.group-sub-table{width:100%; border-collapse:collapse; font-size:12px;}
.group-sub-table td{padding:6px 12px; border-top:1px solid var(--border);}
.group-sub-table th{font-size:10.5px; color:var(--text-light); text-transform:uppercase; font-weight:bold; border-top:1px solid var(--border);}

.footer-note{margin-top:40px; padding-top:16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-light); text-align:center;}

@media (max-width:1100px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .sector-card-row{grid-template-columns:1fr;}
  .grid-2, .grid-3{grid-template-columns:1fr;}
}
</style>
</head>

function fmtPct(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n > 0 ? '+' : '';
  return sign + n.toLocaleString('vi-VN', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
}
function median(arr){
  const a = [...arr].sort((x,y)=>x-y);
  const mid = Math.floor(a.length/2);
  return a.length % 2 !== 0 ? a[mid] : (a[mid-1]+a[mid])/2;
}
function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function debounce(fn, ms){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

  return [(v>>16)&255, (v>>8)&255, v&255];
}
function rgbToCss(rgb){ return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; }
function lerpColor(c1, c2, t){
  return [0,1,2].map(i => Math.round(c1[i] + (c2[i]-c1[i])*t));
}

/* ---------- Generic quantile helper (for box plots) ---------- */
function quantile(sortedArr, q){
  const pos = (sortedArr.length - 1) * q;
  const base = Math.floor(pos);
  const rest = pos - base;
  if (sortedArr[base+1] !== undefined){
    return sortedArr[base] + rest * (sortedArr[base+1] - sortedArr[base]);
  }
  return sortedArr[base];
}

/* ---------- Custom SVG box plot (no external chart library) ---------- */
function drawBoxPlot(containerId, series, colorHex, opts){
  // series: [{label, values}, ...] — draws one box per series, side by side
  const container = document.getElementById(containerId);
  if (!container) return;
  const W = (opts && opts.width) || 260, H = (opts && opts.height) || 150;
  const padL = (opts && opts.padL) || 40, padR = 10, padT = 14, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const fontLbl = (opts && opts.fontLbl) || 9, fontAxis = (opts && opts.fontAxis) || 8;

  const allVals = series.flatMap(s=>s.values);
  const globalMin = Math.min(...allVals), globalMax = Math.max(...allVals);
  const range = (globalMax - globalMin) || 1;
  const y = (v) => padT + plotH - ((v - globalMin) / range) * plotH;

  const boxW = plotW / series.length * ((opts && opts.boxWidthFrac) || 0.42);
  const tooltip = ensureMapTooltip();

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block;">`;
  // y-axis gridlines + labels
  const gridSteps = (opts && opts.gridSteps) || [globalMin, (globalMin+globalMax)/2, globalMax];
  gridSteps.forEach(v=>{
    const yy = y(v);
    svg += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eef1f4" stroke-width="1"></line>`;
    svg += `<text x="${padL-4}" y="${yy+3}" text-anchor="end" font-size="${fontAxis}" fill="${COLORS.grayText}" font-family="Arial">${fmt(v)}</text>`;
  });

  series.forEach((s, i) => {
    const sorted = [...s.values].sort((a,b)=>a-b);
    const q1 = quantile(sorted, 0.25), med = quantile(sorted, 0.5), q3 = quantile(sorted, 0.75);
    const mn = sorted[0], mx = sorted[sorted.length-1];
    const cx = padL + plotW * ((i + 0.5) / series.length);
    const opacity = i === series.length - 1 ? 1 : 0.55;

    svg += `<line x1="${cx}" y1="${y(mx)}" x2="${cx}" y2="${y(q3)}" stroke="${colorHex}" stroke-width="1.3" opacity="${opacity}"></line>`;
    svg += `<line x1="${cx}" y1="${y(q1)}" x2="${cx}" y2="${y(mn)}" stroke="${colorHex}" stroke-width="1.3" opacity="${opacity}"></line>`;
    svg += `<line x1="${cx-boxW/3}" y1="${y(mx)}" x2="${cx+boxW/3}" y2="${y(mx)}" stroke="${colorHex}" stroke-width="1.3" opacity="${opacity}"></line>`;
    svg += `<line x1="${cx-boxW/3}" y1="${y(mn)}" x2="${cx+boxW/3}" y2="${y(mn)}" stroke="${colorHex}" stroke-width="1.3" opacity="${opacity}"></line>`;
    svg += `<rect x="${cx-boxW/2}" y="${y(q3)}" width="${boxW}" height="${Math.max(1,y(q1)-y(q3))}" fill="${colorHex}" opacity="${opacity*0.55}" stroke="${colorHex}" stroke-width="1.3" class="box-hover" data-tip="<b>${escapeHtml(s.label)}</b><br>Trung vị: ${fmt(med)}<br>Q1: ${fmt(q1)} — Q3: ${fmt(q3)}<br>Min: ${fmt(mn)} — Max: ${fmt(mx)}"></rect>`;
    svg += `<line x1="${cx-boxW/2}" y1="${y(med)}" x2="${cx+boxW/2}" y2="${y(med)}" stroke="${colorHex}" stroke-width="2"></line>`;
    svg += `<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="${fontLbl}" font-weight="bold" fill="${COLORS.grayText}" font-family="Arial">${escapeHtml(s.label)}</text>`;
  });
  svg += `</svg>`;
  container.innerHTML = svg;

  container.querySelectorAll('.box-hover').forEach(el => {

    el.style.cursor = 'pointer';
    el.addEventListener('mousemove', (e)=> showTooltip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTooltip);
  });
}

/* ---------- Custom SVG combo chart: bars (primary axis) + line (secondary axis) ---------- */
function drawComboChart(containerId, categories, barVals, lineVals, barColorHex, lineColorHex, barLabel, lineLabel){
  const container = document.getElementById(containerId);
  if (!container) return;
  const n = categories.length;
  const W = Math.max(500, n * 46), H = 340;
  const padL = 56, padR = 46, padT = 26, padB = 92;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const maxBar = Math.max(...barVals, 1);
  const maxLine = Math.max(...lineVals, 1);
  const yBar = (v) => padT + plotH - (v / maxBar) * plotH;
  const yLine = (v) => padT + plotH - (v / maxLine) * plotH;
  const bandW = plotW / n;
  const barW = bandW * 0.55;
  const tooltip = ensureMapTooltip();

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">`;
  // gridlines
  for (let g = 0; g <= 4; g++){
    const v = maxBar * g / 4;
    const yy = yBar(v);
    svg += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eef1f4" stroke-width="1"></line>`;
    svg += `<text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="${COLORS.grayText}" font-family="Arial">${fmt(v)}</text>`;
  }
  for (let g = 0; g <= 4; g++){
    const v = maxLine * g / 4;
    const yy = yLine(v);
    svg += `<text x="${W-padR+6}" y="${yy+3}" text-anchor="start" font-size="9" fill="${COLORS.blue}" font-family="Arial">${Math.round(v)}</text>`;
  }

  // bars
  categories.forEach((cat, i) => {
    const cx = padL + bandW * (i + 0.5);
    const v = barVals[i];
    const barH = plotH - (yBar(v) - padT);
    svg += `<rect x="${cx-barW/2}" y="${yBar(v)}" width="${barW}" height="${Math.max(0,barH)}" fill="${barColorHex}" rx="2" class="combo-bar" data-tip="<b>${escapeHtml(cat)}</b><br>${barLabel}: ${fmt(v)}<br>${lineLabel}: ${lineVals[i]}"></rect>`;
    svg += `<text x="${cx}" y="${H-padB+14}" text-anchor="end" font-size="9" fill="${COLORS.grayText}" font-family="Arial" transform="rotate(-45 ${cx} ${H-padB+14})">${escapeHtml(truncate(cat,16))}</text>`;
  });

  // line
  const linePoints = categories.map((cat,i)=>{
    const cx = padL + bandW * (i + 0.5);
    return `${cx},${yLine(lineVals[i])}`;
  }).join(' ');
  svg += `<polyline points="${linePoints}" fill="none" stroke="${lineColorHex}" stroke-width="2"></polyline>`;
  categories.forEach((cat,i)=>{
    const cx = padL + bandW * (i + 0.5);
    svg += `<circle cx="${cx}" cy="${yLine(lineVals[i])}" r="3" fill="${lineColorHex}" class="combo-dot" data-tip="<b>${escapeHtml(cat)}</b><br>${barLabel}: ${fmt(barVals[i])}<br>${lineLabel}: ${lineVals[i]}"></circle>`;
  });

  // legend
  svg += `<rect x="${padL}" y="4" width="9" height="9" fill="${barColorHex}"></rect><text x="${padL+13}" y="12" font-size="9.5" fill="${COLORS.grayText}" font-family="Arial">${barLabel}</text>`;
  const legend2X = padL + barLabel.length * 5.8 + 40;
  svg += `<line x1="${legend2X}" y1="8" x2="${legend2X+14}" y2="8" stroke="${lineColorHex}" stroke-width="2"></line><text x="${legend2X+18}" y="12" font-size="9.5" fill="${COLORS.grayText}" font-family="Arial">${lineLabel}</text>`;

  svg += `</svg>`;
  container.innerHTML = svg;

  container.querySelectorAll('.combo-bar, .combo-dot').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('mousemove', (e)=> showTooltip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTooltip);
  });
}

/* ---------- Custom SVG squarified treemap ---------- */
function squarify(items, x, y, w, h){
  // items: [{name, value, ...}] sorted desc by value; returns items with rect {x,y,w,h}
  const results = [];
  function worst(row, length){
    const sum = row.reduce((a,b)=>a+b.value,0);
    if (sum === 0) return Infinity;
    let max = -Infinity, min = Infinity;
    row.forEach(r=>{ if(r.value>max) max=r.value; if(r.value<min) min=r.value; });
    const s2 = sum*sum, l2 = length*length;
    return Math.max((l2*max)/s2, s2/(l2*min));
  }
  function layoutRow(row, x, y, w, h, horizontal){
    const sum = row.reduce((a,b)=>a+b.value,0);
    let offset = 0;
    row.forEach(r=>{
      const frac = sum ? r.value / sum : 0;
      if (horizontal){
        const rw = w, rh = h * frac;
        results.push({...r, x, y: y+offset, w: rw, h: rh});
        offset += rh;
      } else {
        const rw = w * frac, rh = h;
        results.push({...r, x: x+offset, y, w: rw, h: rh});
        offset += rw;
      }
    });
  }
  function recurse(items, x, y, w, h){
    if (items.length === 0) return;
    if (items.length === 1){
      results.push({...items[0], x, y, w, h});
      return;
    }
    const horizontal = w >= h;
    const length = horizontal ? h : w;
    let row = [items[0]];
    let i = 1;
    while (i < items.length){
      const testRow = [...row, items[i]];
      if (worst(testRow, length) <= worst(row, length)){
        row = testRow;
        i++;
      } else break;
    }
    const rowSum = row.reduce((a,b)=>a+b.value,0);
    const total = items.reduce((a,b)=>a+b.value,0);
    if (horizontal){
      const rowW = total ? w * (rowSum/total) : 0;
      layoutRow(row, x, y, rowW, h, false);
      recurse(items.slice(row.length), x+rowW, y, w-rowW, h);
    } else {
      const rowH = total ? h * (rowSum/total) : 0;
      layoutRow(row, x, y, w, rowH, true);
      recurse(items.slice(row.length), x, y+rowH, w, h-rowH);
    }
  }
  recurse(items, x, y, w, h);
  return results;
}

function drawTreemap(containerId, items, colorHexLight, colorHexDark){
  const container = document.getElementById(containerId);
  if (!container) return;
  const W = 500, H = 420;
  const sorted = [...items].filter(it=>it.value>0).sort((a,b)=>b.value-a.value);
  const laidOut = squarify(sorted, 0, 0, W, H);
  const maxV = Math.max(...sorted.map(i=>i.value), 1);
  const scale = makeColorScale(colorHexDark);

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block;">`;
  laidOut.forEach(r => {
    if (r.w <= 0 || r.h <= 0) return;
    const t = r.value / maxV;
    const fill = scale(0.25 + t*0.75);
    svg += `<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${Math.max(0,r.w-1).toFixed(1)}" height="${Math.max(0,r.h-1).toFixed(1)}" fill="${fill}" stroke="#fff" stroke-width="1" class="tm-cell" data-tip="<b>${escapeHtml(r.name)}</b><br>${escapeHtml(r.sub||'')}<br>${fmt(r.value)} tấn CO2tđ"></rect>`;
    if (r.w > 46 && r.h > 20){
      const fontSize = Math.min(11, Math.max(7, r.w/9));
      svg += `<text x="${(r.x+4).toFixed(1)}" y="${(r.y+fontSize+3).toFixed(1)}" font-size="${fontSize}" fill="#fff" font-family="Arial" font-weight="bold" style="pointer-events:none;">${escapeHtml(truncate(r.name, Math.floor(r.w/6)))}</text>`;
      if (r.h > 34){
        svg += `<text x="${(r.x+4).toFixed(1)}" y="${(r.y+fontSize*2+5).toFixed(1)}" font-size="${Math.max(7,fontSize-1.5)}" fill="rgba(255,255,255,0.9)" font-family="Arial" style="pointer-events:none;">${fmt(r.value)}</text>`;
      }
    }
  });
  svg += `</svg>`;
  container.innerHTML = svg;

  container.querySelectorAll('.tm-cell').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('mousemove', (e)=> showTooltip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTooltip);
  });
}

function renderVietnamMap(containerId, valuesByProvince, colorHex, unitLabel, formatFn){
  const container = document.getElementById(containerId);
  if (!container) return;
  const W = SVGMAP.width, H = SVGMAP.height;
  const vals = Object.values(valuesByProvince).filter(v=>v>0);
  const maxV = vals.length ? Math.max(...vals) : 1;
  const minV = 0;
  const scale = makeColorScale(colorHex);
  const tooltip = ensureMapTooltip();

  const provinceNames = Object.keys(SVGMAP.provinces);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block;" preserveAspectRatio="xMidYMid meet">`;
  provinceNames.forEach(name => {
    const d = SVGMAP.provinces[name];
    // match dataset name (e.g. "Hồ Chí Minh" -> geo "TP. Hồ Chí Minh")
    const dataName = Object.keys(PROV_TO_GEO).find(k=>PROV_TO_GEO[k]===name) || name;
    const val = valuesByProvince[dataName] || 0;
    const t = maxV > 0 ? val / maxV : 0;
    const fill = val > 0 ? scale(t) : '#f3f5f7';
    svg += `<path d="${d}" fill="${fill}" stroke="#ffffff" stroke-width="0.8" data-prov="${escapeHtml(dataName)}" data-val="${val}" class="vn-province" style="cursor:pointer;transition:opacity .1s;"></path>`;
  });

  // Hoàng Sa / Trường Sa inset box (standard convention on official Vietnamese maps)
  const insetX = W - 132, insetY = H - 158, insetW = 118, insetH = 148;
  svg += `
    <g>
      <rect x="${insetX}" y="${insetY}" width="${insetW}" height="${insetH}" fill="#fbfcfd" stroke="${COLORS.border}" stroke-width="1" stroke-dasharray="3,2" rx="4"></rect>
      <text x="${insetX+insetW/2}" y="${insetY+16}" text-anchor="middle" font-size="8.5" font-weight="bold" fill="${COLORS.blue}" font-family="Arial">QUẦN ĐẢO VIỆT NAM</text>
      <circle cx="${insetX+30}" cy="${insetY+45}" r="2.2" fill="${COLORS.blue}"></circle>
      <circle cx="${insetX+36}" cy="${insetY+52}" r="1.6" fill="${COLORS.blue}"></circle>
      <circle cx="${insetX+25}" cy="${insetY+56}" r="1.4" fill="${COLORS.blue}"></circle>
      <text x="${insetX+insetW/2}" y="${insetY+74}" text-anchor="middle" font-size="7.5" fill="${COLORS.grayText}" font-family="Arial">Hoàng Sa</text>
      <text x="${insetX+insetW/2}" y="${insetY+84}" text-anchor="middle" font-size="6.5" fill="${COLORS.grayText}" font-family="Arial">(TP. Đà Nẵng)</text>
      <circle cx="${insetX+28}" cy="${insetY+108}" r="1.6" fill="${COLORS.blue}"></circle>
      <circle cx="${insetX+38}" cy="${insetY+112}" r="1.3" fill="${COLORS.blue}"></circle>
      <circle cx="${insetX+45}" cy="${insetY+104}" r="1.4" fill="${COLORS.blue}"></circle>
      <circle cx="${insetX+33}" cy="${insetY+118}" r="1.2" fill="${COLORS.blue}"></circle>
      <text x="${insetX+insetW/2}" y="${insetY+134}" text-anchor="middle" font-size="7.5" fill="${COLORS.grayText}" font-family="Arial">Trường Sa</text>
      <text x="${insetX+insetW/2}" y="${insetY+144}" text-anchor="middle" font-size="6.5" fill="${COLORS.grayText}" font-family="Arial">(T. Khánh Hòa)</text>
    </g>`;

  svg += `</svg>`;
  container.innerHTML = svg;

  // interactivity
  container.querySelectorAll('.vn-province').forEach(path => {
    path.addEventListener('mousemove', (e) => {
      const name = path.dataset.prov;
      const val = Number(path.dataset.val);
      tooltip.innerHTML = `<b>${escapeHtml(name)}</b><br>${unitLabel}: ${val > 0 ? formatFn(val) : 'Không có dữ liệu'}`;
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 10) + 'px';
      tooltip.style.display = 'block';
      path.style.opacity = '0.75';
    });
    path.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      path.style.opacity = '1';
    });
  });

  // legend
  const legendId = containerId + '-legend';
  let legendEl = document.getElementById(legendId);
  if (!legendEl){
    legendEl = document.createElement('div');
    legendEl.id = legendId;
    legendEl.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:10.5px;color:'+COLORS.grayText+';margin-top:6px;justify-content:center;';
    container.parentElement.appendChild(legendEl);
  }
  const stops = [0,0.25,0.5,0.75,1].map(t=>scale(t)).join(',');
  legendEl.innerHTML = `<span>Thấp</span><div style="width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,${stops});"></div><span>Cao (${formatFn(maxV)})</span>`;
}

function drawOverviewMaps(){
  const agg = getProvinceAggForSector(ovMapSector);
  const colorHex = ovMapSector === 'Nhiệt điện' ? COLORS.red
    : ovMapSector === 'Xi măng' ? COLORS.orange
    : ovMapSector === 'Sắt thép' ? COLORS.yellow
    : COLORS.blue;

  ['2025','2026'].forEach(year=>{
    const values = {};
    Object.entries(agg).forEach(([prov, d])=>{
      values[prov] = ovMapMetric === 'quota' ? d['q'+year] : d.count;
    });
    const unitLabel = ovMapMetric === 'quota' ? `Hạn ngạch ${year} (tấn CO2tđ)` : 'Số doanh nghiệp';

  });
}

function populateProvinceFilter(selectEl, provList){
  const opts = provList.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  selectEl.insertAdjacentHTML('beforeend', opts);
}

function renderOverviewTable(){
  const nameQ = document.getElementById('ov-search-name').value.trim().toLowerCase();
  const mstQ = document.getElementById('ov-search-mst').value.trim().toLowerCase();
  const provQ = document.getElementById('ov-search-province').value;
  const sectorQ = document.getElementById('ov-search-sector').value;

  let rows = DATA.enterprises.filter(e=>{
    if (nameQ && !e.name.toLowerCase().includes(nameQ)) return false;
    if (mstQ && !e.mst.toLowerCase().includes(mstQ)) return false;
    if (provQ && e.province_new !== provQ) return false;
    if (sectorQ && e.sector !== sectorQ) return false;
    return true;
  });
  rows = rows.slice().sort((a,b)=>b.q2026-a.q2026);

  document.getElementById('ov-result-count').textContent = `Tìm thấy ${rows.length} / ${DATA.enterprises.length} doanh nghiệp`;

  const tbody = document.getElementById('ov-table-body');
  if (rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--text-light);padding:20px;">Không tìm thấy kết quả phù hợp</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.slice(0,300).map((e,i)=>`
    <tr>
      <td>${i+1}</td>
      <td><b>${escapeHtml(e.name)}</b><br><span style="color:var(--text-light);font-size:11px;">${escapeHtml(e.province_old)}</span></td>
      <td><span class="tag-sector ${sectorCardClass(e.sector)}">${escapeHtml(e.sector)}</span></td>
      <td>${escapeHtml(e.mst)}</td>
      <td>${escapeHtml(e.province_new)}</td>
      <td style="text-align:right;">${fmt(e.q2025)}</td>
      <td style="text-align:right;">${fmt(e.q2026)}</td>
    </tr>`).join('');
}

function initOverviewSearch(){
  const provList = [...new Set(DATA.enterprises.map(e=>e.province_new))].sort((a,b)=>a.localeCompare(b,'vi'));
  populateProvinceFilter(document.getElementById('ov-search-province'), provList);

  const rerender = debounce(renderOverviewTable, 150);
  ['ov-search-name','ov-search-mst'].forEach(id=>{

  ['ov-search-province','ov-search-sector'].forEach(id=>{

  renderOverviewTable();
}

/* ---------- Overview: Đơn vị cùng mã số thuế (chuyển từ các trang chuyên ngành) ---------- */
function renderOverviewGroups(){
  const el = document.getElementById('ov-group-panel');
  const groups = DATA.groups;
  if (!el) return;
  if (!groups || groups.length === 0){
    el.innerHTML = `<div style="color:var(--text-light);font-size:12.5px;padding:6px 2px;">Không có đơn vị nào cùng mã số thuế gốc.</div>`;
    return;
  }
  el.innerHTML = groups.map(g=>{
    const total2025 = g.items.reduce((s,i)=>s+i.q2025,0);
    const total2026 = g.items.reduce((s,i)=>s+i.q2026,0);
    return `
    <div class="group-block">
      <div class="group-head">
        <span><b>${escapeHtml(g.group)}</b> — MST gốc: ${escapeHtml(g.base_mst)} (${g.count} cơ sở) <span class="tag-sector ${sectorCardClass(g.sector)}" style="margin-left:6px;">${escapeHtml(g.sector)}</span></span>
        <span>Tổng hạn ngạch: <b>${fmt(total2025)}</b> (2025) / <b>${fmt(total2026)}</b> (2026) tấn CO2tđ</span>
      </div>
      <table class="group-sub-table">
        <thead><tr>
          <th style="text-align:left;padding:6px 12px;">Cơ sở</th>
          <th style="text-align:left;padding:6px 12px;">Mã số thuế</th>
          <th style="text-align:left;padding:6px 12px;">Tỉnh/Thành</th>
          <th style="text-align:right;padding:6px 12px;">Hạn ngạch 2025</th>
          <th style="text-align:right;padding:6px 12px;">Hạn ngạch 2026</th>
        </tr></thead>
        ${g.items.map(i=>`
          <tr>
            <td style="width:35%;">${escapeHtml(i.name)}</td>
            <td style="color:var(--text-light);">${escapeHtml(i.mst)}</td>
            <td style="color:var(--text-light);">${escapeHtml(i.province)}</td>
            <td style="text-align:right;font-weight:bold;">${fmt(i.q2025)} tấn</td>
            <td style="text-align:right;font-weight:bold;">${fmt(i.q2026)} tấn</td>
          </tr>`).join('')}
      </table>
    </div>`;
  }).join('');
}

function renderSectorTable(key){
  const sectorName = SECTOR_KEY[key];
  const nameQ = document.getElementById(key+'-search-name').value.trim().toLowerCase();
  const mstQ = document.getElementById(key+'-search-mst').value.trim().toLowerCase();
  const provQ = document.getElementById(key+'-search-province').value;

  const all = DATA.enterprises.filter(e=>e.sector===sectorName);
  let rows = all.filter(e=>{
    if (nameQ && !e.name.toLowerCase().includes(nameQ)) return false;
    if (mstQ && !e.mst.toLowerCase().includes(mstQ)) return false;
    if (provQ && e.province_new !== provQ) return false;
    return true;
  });
  rows = rows.slice().sort((a,b)=>b.q2026-a.q2026);

  document.getElementById(key+'-result-count').textContent = `Tìm thấy ${rows.length} / ${all.length} doanh nghiệp`;
  const tbody = document.getElementById(key+'-table-body');
  if (rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-light);padding:20px;">Không tìm thấy kết quả phù hợp</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((e,i)=>`
    <tr>
      <td>${i+1}</td>
      <td><b>${escapeHtml(e.name)}</b></td>
      <td>${escapeHtml(e.mst)}</td>
      <td>${escapeHtml(e.province_new)}</td>
      <td style="text-align:right;">${fmt(e.q2025)}</td>
      <td style="text-align:right;">${fmt(e.q2026)}</td>
    </tr>`).join('');
}

function initSectorSearch(key){
  const sectorName = SECTOR_KEY[key];
  const provList = [...new Set(DATA.enterprises.filter(e=>e.sector===sectorName).map(e=>e.province_new))].sort((a,b)=>a.localeCompare(b,'vi'));
  populateProvinceFilter(document.getElementById(key+'-search-province'), provList);
  const rerender = debounce(()=>renderSectorTable(key), 150);
  document.getElementById(key+'-search-name').addEventListener('input', rerender);
  document.getElementById(key+'-search-mst').addEventListener('input', rerender);
  document.getElementById(key+'-search-province').addEventListener('change', ()=>renderSectorTable(key));
  renderSectorTable(key);
}

function renderSectorBoxplot(key){
  const sectorName = SECTOR_KEY[key];
  const d = DATA.sector_summary[sectorName];
  const color = sectorAccentColor(key);
  drawBoxPlot(key+'-boxplot', [
    {label:'Hạn ngạch 2025', values:d.q2025_list},
    {label:'Hạn ngạch 2026', values:d.q2026_list},
  ], color, {width:420, height:280, padL:60, fontLbl:11, fontAxis:10, boxWidthFrac:0.5,
    gridSteps: [0, 0.25, 0.5, 0.75, 1].map(f => Math.min(...d.q2025_list, ...d.q2026_list) + f*(Math.max(...d.q2025_list, ...d.q2026_list)-Math.min(...d.q2025_list, ...d.q2026_list)))});

  const statsEl = document.getElementById(key+'-boxstats');
  if (statsEl){
    const rows = [
      {yr:'2025', min:d.q2025_min, med:d.q2025_median, max:d.q2025_max},
      {yr:'2026', min:d.q26_min, med:d.q26_median, max:d.q26_max},
    ];
    statsEl.innerHTML = `
      <div style="font-size:11px;font-weight:bold;color:${COLORS.grayText};text-transform:uppercase;margin-bottom:8px;">Thống kê hạn ngạch/DN (tấn CO2tđ)</div>
      ${rows.map(r=>`
        <div style="margin-bottom:12px;">
          <div style="font-size:12.5px;font-weight:bold;color:${color};margin-bottom:4px;">Năm ${r.yr}</div>
          <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border);"><span style="color:var(--text-light);">Min</span><b>${fmt(r.min)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border);"><span style="color:var(--text-light);">Trung vị</span><b>${fmt(r.med)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;"><span style="color:var(--text-light);">Max</span><b>${fmt(r.max)}</b></div>
        </div>`).join('')}
    `;
  }
}

function renderSectorAll(key){
  renderSectorKPIs(key);
  renderSectorBoxplot(key);
  renderSectorProvinceChart(key);
  renderSectorTreemap(key);
  renderSectorMinMax(key);
}

function initSectorPage(key){
  sectorState[key] = {year:'2025'};
  document.getElementById(key+'-year-tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-year]');
    if (!btn) return;
    sectorState[key].year = btn.dataset.year;
    document.querySelectorAll('#'+key+'-year-tabs button').forEach(b=>b.classList.toggle('active', b===btn));
    renderSectorAll(key);
  });
  renderSectorAll(key);
  initSectorSearch(key);
}

</script>
